# PoLAr-MAE full-1M SSL run, 20 epochs, epoch-based schedule.
#
# Round 2 of the polarmae pretraining: same architecture / data as
# polarmae_apa2d_full.yml, but instead of 20k steps (~0.36 epoch over the 1M
# set) this trains for up to 20 FULL epochs on 00[1-8] (~890k events), with
# subrun 009 held out as the SSL val set. Val (recon loss + probe) runs every
# epoch; EarlyStopping watches loss/val. Designed for 4-GPU DDP.
#
#   train: prod-jay-1M-2026-02-27/13825/1/00[1-8]   (unlabeled)
#   val:   prod-jay-1M-2026-02-27/13825/1/009        (recon-loss val, capped 2000)
#   probe: prod-jay-100k-truth-2026-02-27 ...        (in-training quick-look;
#          the authoritative per-epoch metric is the trailing UNIFIED probe)
#
# DDP note: the in-training APA2DProbeCallback is INTENTIONALLY OMITTED here.
# It runs its probe (model forward + sklearn fit + logging) on rank 0 only,
# which desyncs the NCCL collective sequence across ranks and deadlocks
# validation under DDP. It is also the OLD pixel-split (leaky) probe and is
# redundant: the authoritative per-epoch metric is the trailing leakage-free
# UNIFIED probe (gridutils/eval_epochs_polarmae.sh), run per checkpoint. Only
# loss/val (logged on all ranks, DDP-safe) drives EarlyStopping here.

seed_everything: 0

trainer:
  sync_batchnorm: false
  gradient_clip_val: 3
  devices: 4
  num_nodes: 1
  strategy: ddp_find_unused_parameters_true
  max_epochs: 20
  max_steps: -1
  precision: bf16-mixed
  check_val_every_n_epoch: 1
  val_check_interval: null
  log_every_n_steps: 50
  callbacks:
    - class_path: pytorch_lightning.callbacks.EarlyStopping
      init_args:
        monitor: loss/val
        mode: min
        patience: 3
        min_delta: 0.0
        check_on_train_epoch_end: false
        verbose: true
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        # keep EVERY epoch's checkpoint so the trailing unified eval can score
        # each one; saved at validation-epoch-end. dirpath from env so the path
        # is stable (Lightning's default nests under lightning_logs/version_N).
        # Lightning renders {epoch}/{step} as "epoch=NN"/"step=M", so the files
        # are "epoch=NN-step=M.ckpt" (matched by the eval glob epoch*-step*).
        dirpath: ${oc.env:CKPT_DIR}
        every_n_epochs: 1
        save_top_k: -1
        save_last: true
        save_on_train_epoch_end: false
        filename: "{epoch:02d}-{step}"

model:
  loss_weights:
    ae: 0.0
    chamfer: 1.0
    energy: 1.0
  encoder:
    class_path: polarmae.layers.encoder.TransformerEncoder
    init_args:
      num_channels: 4
      arch: vit_small
      voxel_size: 5
      masking_ratio: 0.6
      masking_type: rand
      tokenizer_kwargs:
        group_radius: ${eval:'${model.encoder.init_args.voxel_size} * ${model.transformation_scale_factor}'}
      apply_relative_position_bias: false
      transformer_kwargs:
        postnorm: false
        add_pos_at_every_layer: true
        drop_rate: 0.0
        attn_drop_rate: 0.05
        drop_path_rate: 0.25
        use_flash_self_attn: true
  decoder:
    class_path: polarmae.layers.decoder.TransformerDecoder
    init_args:
      arch: ${model.encoder.init_args.arch}
      transformer_kwargs:
        postnorm: true
        depth: 4
        add_pos_at_every_layer: ${model.encoder.init_args.transformer_kwargs.add_pos_at_every_layer}
        drop_rate: ${model.encoder.init_args.transformer_kwargs.drop_rate}
        attn_drop_rate: ${model.encoder.init_args.transformer_kwargs.attn_drop_rate}
        drop_path_rate: ${model.encoder.init_args.transformer_kwargs.drop_path_rate}
        use_flash_self_attn: ${model.encoder.init_args.transformer_kwargs.use_flash_self_attn}
  mae_prediction: full

  # LR for effective batch 64 (4 GPUs x batch 16). Upstream base is ~1e-4 at
  # BS=128; sqrt-scaled: 1e-4 * sqrt(64/128) ~= 7e-5.
  learning_rate: 7.0e-5
  optimizer_adamw_weight_decay: 0.05
  # Epoch-based schedule: 1-epoch linear warmup, cosine over 20 epochs.
  lr_scheduler_stepping: epoch
  lr_scheduler_linear_warmup_epochs: 1
  lr_scheduler_linear_warmup_start_lr: 3e-6
  lr_scheduler_cosine_eta_min: 3e-6
  svm_validation_max_tokens: 7500
  svm_validation_C: 0.005

  train_transformations: [center_and_scale]
  val_transformations:   [center_and_scale]

  transformation_center: [525, 562, 0]
  transformation_scale_factor: ${eval:'1.0 / 600.0'}
  transformation_rotate_dims: null
  transformation_rotate_degs: null

  svm_validation: {}

data:
  class_path: polarmae.datasets.APA2DDataModule
  init_args:
    data_path:     /gpfs01/lbne/users/fm/cffm-data/prod-jay-1M-2026-02-27/13825/1/00[1-8]
    val_data_path: /gpfs01/lbne/users/fm/cffm-data/prod-jay-1M-2026-02-27/13825/1/009
    batch_size: 16
    num_workers: 2
    dataset_kwargs:
      apa: 0
      view: W
      emin: 1.0
      emax: 1.0e5
      energy_threshold: 1.0
      min_points: 256
      max_points: 8000
      maxlen: -1
      return_semantic_id: false
      return_cluster_id: false
    test_dataset_kwargs:
      maxlen: 2000
